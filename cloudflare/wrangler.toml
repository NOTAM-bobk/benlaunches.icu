name = "boring-internet-votes"
main = "votes-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Secrets (never listed below, never committed — `wrangler deploy` leaves
# secrets alone, so a redeploy cannot clear them):
#   ADMIN_PASSWORD   unlocks /admin/*
#   GITHUB_TOKEN     "Approve & publish" commits config/sites.json through the
#                    GitHub contents API; needs Contents: Read and write on
#                    GITHUB_REPO (a fine-grained PAT, or a classic PAT with the
#                    `public_repo` scope). Set it with
#                      wrangler secret put GITHUB_TOKEN --config cloudflare/wrangler.toml
#                    or the dashboard's Variables and Secrets → type "Secret".
#
# Everything in [vars] below is public: it ships in the Worker bundle and is
# readable in the Cloudflare dashboard, so it must never hold a credential.
# Values added as plain-text variables in the dashboard are overwritten by the
# next `wrangler deploy` — that is why the non-secret settings are mirrored here.
[[kv_namespaces]]
binding = "VOTES"
id = "36580dc8d626443cbe3783979036b9b9"

# Origins allowed to call the Worker from a browser. Comma-separated, exact
# origin only (scheme + host) — no trailing slash and no path, because a
# browser's Origin header never carries one. The first entry is the fallback
# used when the caller's origin is not on the list.
[vars]
ALLOWED_ORIGIN = "https://benlaunches.icu,https://www.benlaunches.icu,https://new.base31.org,https://boringinternet.vercel.app"

# Where /admin/publish writes an approved submission. Change GITHUB_REPO if the
# directory repository lives somewhere else. GITHUB_TOKEN is deliberately
# absent: it is a secret, not a var — see the note at the top of this file.
GITHUB_BRANCH = "main"
GITHUB_REPO = "NOTAM-bobk/benlaunches.icu"
GITHUB_SITES_PATH = "config/sites.json"
