# Base44 development environment: runs the Vite dev server from the cloned
# source so edits appear without image rebuilds. See AGENTS.md for details.
services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE
      # Platform-provided extra host the preview proxy uses; Vite >= 6.1
      # appends it to its allowedHosts. Leave empty for local use.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
    # Install from the lockfile, then exec the dev server (vite.config.ts sets
    # host: true, strictPort: true; port comes from the CLI).
    command: ["sh", "-ec", "CI=true npm ci --no-audit --fund=false && exec npm run dev -- --port 5173 --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
