name = "boring-internet-votes"
main = "votes-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Reads and votes are public; /admin/* requires the ADMIN_PASSWORD secret.
# `wrangler secret put ADMIN_PASSWORD` sets it (never commit the value).
#
# "Approve & publish" on the Admin page commits a formatted entry into
# config/sites.json through the GitHub contents API, which needs a repo token:
#   wrangler secret put GITHUB_TOKEN      (a fine-grained PAT with Contents: Read and write)
# The repo, branch and file are not secret, so they live in [vars] below.
[[kv_namespaces]]
binding = "VOTES"
id = "36580dc8d626443cbe3783979036b9b9"

# Origins allowed to call the Worker from a browser. Comma-separated, exact
# origin only (scheme + host) — no trailing slash and no path, because a
# browser's Origin header never carries one. The first entry is the fallback
# used when the caller's origin is not on the list.
[vars]
ALLOWED_ORIGIN = "https://benlaunches.icu,https://www.benlaunches.icu,https://new.base31.org,https://boringinternet.vercel.app"

# Where /admin/publish writes an approved submission. Change GITHUB_REPO if the
# directory repository lives somewhere else.
GITHUB_REPO = "NOTAM-bobk/benlaunches.icu"
GITHUB_BRANCH = "main"
GITHUB_SITES_PATH = "config/sites.json"
